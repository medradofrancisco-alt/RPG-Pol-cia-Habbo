<!-- MENU PRINCIPAL DO HUD (Fica fixo na tela) -->
<div id="hud-menu" style="position: fixed; top: 10px; left: 10px; background: #1a1a1a; border: 2px solid #333; padding: 8px; border-radius: 8px; display: flex; gap: 8px; z-index: 9999; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
    <button onclick="toggleIlha('ilha-punicoes')" style="background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">⚖️ Punições</button>
    <button onclick="toggleIlha('ilha-manuais')" style="background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">📖 Manuais</button>
    <button onclick="toggleIlha('ilha-patrulha')" style="background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">🛡️ Patrulha</button>
</div>

<!-- ILHA 1: PUNIÇÕES -->
<div id="ilha-punicoes" class="ilha-flutuante" style="display: none; position: absolute; top: 80px; left: 50px; width: 300px; background: #1e1e1e; border: 2px solid #444; border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,0.7); z-index: 10000;">
    <div class="ilha-header" style="background: #2b2b2b; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: move; border-bottom: 1px solid #444; color: #fff; font-weight: bold;">
        <span>⚖️ Tabela de Punições</span>
        <button onclick="fecharIlha('ilha-punicoes')" style="background: #c0392b; color: #fff; border: none; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-weight: bold;">X</button>
    </div>
    <div style="padding: 12px; color: #ddd; font-size: 14px;">
        <p>• Advertência Verbal</p>
        <p>• Suspensão de 1 dia</p>
        <p>• Demissão por justa causa</p>
    </div>
</div>

<!-- ILHA 2: MANUAIS -->
<div id="ilha-manuais" class="ilha-flutuante" style="display: none; position: absolute; top: 80px; left: 380px; width: 300px; background: #1e1e1e; border: 2px solid #444; border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,0.7); z-index: 10000;">
    <div class="ilha-header" style="background: #2b2b2b; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: move; border-bottom: 1px solid #444; color: #fff; font-weight: bold;">
        <span>📖 Manuais de Acesso Rápido</span>
        <button onclick="fecharIlha('ilha-manuais')" style="background: #c0392b; color: #fff; border: none; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-weight: bold;">X</button>
    </div>
    <div style="padding: 12px; color: #ddd; font-size: 14px;">
        <p>• Protocolo de Abordagem</p>
        <p>• Regras de Patrulhamento</p>
        <p>• Uso de Armamento</p>
    </div>
</div>

<!-- ILHA 3: PATRULHA -->
<div id="ilha-patrulha" class="ilha-flutuante" style="display: none; position: absolute; top: 80px; left: 710px; width: 300px; background: #1e1e1e; border: 2px solid #444; border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,0.7); z-index: 10000;">
    <div class="ilha-header" style="background: #2b2b2b; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: move; border-bottom: 1px solid #444; color: #fff; font-weight: bold;">
        <span>🛡️ Status de Patrulha</span>
        <button onclick="fecharIlha('ilha-patrulha')" style="background: #c0392b; color: #fff; border: none; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-weight: bold;">X</button>
    </div>
    <div style="padding: 12px; color: #ddd; font-size: 14px;">
        <p>Membros em serviço: <b>12</b></p>
        <p>Estado do QG: <span style="color: #2ecc71;">OPERACIONAL</span></p>
    </div>
</div>

<!-- SCRIPT DE CONTROLE (Abrir, Fechar e Arrastar) -->
<script>
function toggleIlha(id) {
    const el = document.getElementById(id);
    if (el.style.display === 'none') {
        el.style.display = 'block';
    } else {
        el.style.display = 'none';
    }
}

function fecharIlha(id) {
    document.getElementById(id).style.display = 'none';
}

// Permitir arrastar as ilhas pela barra superior
document.querySelectorAll('.ilha-flutuante').forEach(ilha => {
    const header = ilha.querySelector('.ilha-header');
    let isDragging = false;
    let startX, startY;

    header.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - ilha.offsetLeft;
        startY = e.clientY - ilha.offsetTop;
        e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        ilha.style.left = (e.clientX - startX) + 'px';
        ilha.style.top = (e.clientY - startY) + 'px';
    });

    document.addEventListener('mouseup', () => {
        isDragging = false;
    });
});
</script>
