<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Polícia - Painel Principal</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        /* FUNDO DE WIRED PERSONALIZADO */
        html, body {
            background: #0f172a url('background.jpg') no-repeat center center fixed !important;
            background-size: cover !important;
            margin: 0;
            padding: 0;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* BARRA SUPERIOR FLUTUANTE */
        .top-bar {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(241, 245, 249, 0.95);
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .hud-btn {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .hud-btn:hover {
            background: #cbd5e1;
            color: #0f172a;
        }

        .hud-btn.lock-status {
            background: #fef08a;
            color: #854d0e;
            border-color: #fde047;
        }

        .hud-btn.logout {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fca5a5;
        }

        .hud-btn.logout:hover {
            background: #ef4444;
            color: white;
        }

        /* CONTAINER HUD */
        .hud-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .interactive-panel {
            pointer-events: auto;
        }

        /* CARD DE LOGIN (SLATE WIRED) */
        .login-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid #0284c7;
            border-radius: 12px;
            padding: 24px;
            width: 340px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8);
            z-index: 2000;
            color: #f8fafc;
            backdrop-filter: blur(8px);
        }

        .login-overlay h3 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #1e293b;
            border: 1px solid #0284c7;
            color: #f8fafc;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
            font-weight: normal;
        }

        /* CAIXA DE CÓDIGO */
        .code-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            border: 1px dashed #38bdf8;
            border-radius: 6px;
            padding: 6px 10px;
            margin: 10px 0;
        }

        .code-box {
            color: #38bdf8;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 1.5px;
            user-select: text !important;
            cursor: text;
        }

        .copy-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: #0369a1;
        }

        /* BALÃO E PERSONAGEM FRANK */
        .frank-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px;
            margin-top: 12px;
            text-align: left;
            overflow: hidden;
        }

        .frank-avatar-wrap {
            width: 48px;
            height: 52px;
            background: #0f172a;
            border-radius: 6px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
