<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Polícia - Painel Principal</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        /* FUNDO CINZA ESTILO WIRED / TEMÁTICO HABBO */
        html, body {
            background-color: #1e293b !important;
            background-image: 
                radial-gradient(#334155 1px, transparent 1px), 
                radial-gradient(#334155 1px, #1e293b 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            margin: 0;
            padding: 0;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* BARRA SUPERIOR FLUTUANTE (CINZA CLARO) */
        .top-bar {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }

        .hud-btn {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .hud-btn:hover {
            background: #cbd5e1;
            color: #0f172a;
        }

        .hud-btn.lock-status {
            background: #fef08a;
            color: #854d0e;
            border-color: #fde047;
        }

        .hud-btn.logout {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fca5a5;
        }

        .hud-btn.logout:hover {
            background: #ef4444;
            color: white;
        }

        /* CONTAINER HUD */
        .hud-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .interactive-panel {
            pointer-events: auto;
        }

        /* CARD DE LOGIN (CINZA ESCURO / SLATE WIRED) */
        .login-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 24px;
            width: 340px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 2000;
            color: #f8fafc;
        }

        .login-overlay h3 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #1e293b;
            border: 1px solid #475569;
            color: #f8fafc;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
            font-weight: normal;
        }

        /* CAIXA DE CÓDIGO (TEXTO COPIÁVEL + BOTÃO) */
        .code-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            border: 1px dashed #38bdf8;
            border-radius: 6px;
            padding: 6px 10px;
            margin: 10px 0;
        }

        .code-box {
            color: #38bdf8;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 1.5px;
            user-select: text !important;
            cursor: text;
        }

        .copy-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: #0369a1;
        }

        /* BALÃO E PERSONAGEM FRANK HABBO */
        .frank-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px;
            margin-top: 12px;
            text-align: left;
            overflow: hidden;
        }

        .frank-avatar-wrap {
            width: 48px;
            height: 52px;
            background: #0f172a;
            border-radius: 6px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .frank-img {
            margin-top: -15px;
        }

        .frank-bubble {
            font-size: 11px;
            line-height: 1.3;
            color: #38bdf8;
            font-weight: 500;
        }

        /* ILHA DO PERFIL (CINZA CLARO) */
        .profile-island {
            position: fixed;
            top: 80px;
            left: 20px;
            width: 260px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            cursor: move;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .profile-avatar {
            width: 54px;
            height: 54px;
            background: #e2e8f0;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .profile-name {
            font-weight: bold;
            font-size: 15px;
            color: #0f172a;
        }

        /* BARRAS DE STATUS */
        .status-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .status-bar-container {
            font-size: 11px;
        }

        .status-label {
            display: flex;
            justify-content: space-between;
            color: #475569;
            margin-bottom: 3px;
        }

        .bar-bg {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }

        .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .fill-coins { background: #eab308; width: 80%; }
        .fill-level { background: #a855f7; width: 60%; }
        .fill-mission { background: #0284c7; width: 100%; }

        /* MINI ABA DE ESTATÍSTICAS */
        .stats-mini-box {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            color: #334155;
        }

        .stat-item {
            text-align: center;
        }

        .stat-val {
            font-weight: bold;
            color: #0284c7;
            font-size: 13px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR FLUTUANTE -->
    <div id="top-bar" class="top-bar interactive-panel hidden">
        <button class="hud-btn" onclick="abrirAba('novidades')">Novidades</button>
        <button class="hud-btn" onclick="abrirAba('apostilas')">Apostilas</button>
        <button class="hud-btn" onclick="abrirAba('instrutor')">Instrutor</button>
        <button class="hud-btn" onclick="abrirAba('estatuto')">Estatuto</button>
        <button id="btn-lock" class="hud-btn lock-status" onclick="alternarBloqueio()">Destravado</button>
        <button class="hud-btn logout" onclick="logout()">Sair</button>
    </div>

    <div class="hud-container">
        <!-- TELA DE LOGIN OVERLAY (CINZA ESCURO / WIRED) -->
        <div id="login-overlay" class="login-overlay interactive-panel">
            <h3>RPG Polícia - Acesso</h3>
            <p style="font-size: 12px; color: #94a3b8;">Autenticação via Missão Habbo</p>

            <div id="login-passo-1">
                <input type="text" id="usuario-input" placeholder="Seu Nick no Habbo">
                <label style="font-size: 11px; color: #cbd5e1; display: flex; align-items: center; justify-content: center; gap: 6px; margin: 8px 0; cursor: pointer;">
                    <input type="checkbox" id="manter-conectado"> Manter conectado
                </label>
                <button type="button" id="btn-gerar" class="hud-btn" style="width: 100%; margin-top: 5px; padding: 10px; background: #0284c7; color: white; border: none;">Gerar Código</button>
            </div>

            <div id="login-passo-2" class="hidden">
                <p style="font-size: 11px; color: #cbd5e1; margin-bottom: 4px;">Cole o código na sua <b>missão (motto)</b>:</p>
                
                <div class="code-container">
                    <span id="codigo-gerado" class="code-box">RPG-0000</span>
                    <button type="button" id="btn-copiar" class="copy-btn">Copiar</button>
                </div>

                <button type="button" id="btn-verificar" class="hud-btn" style="width: 100%; padding: 10px; background: #0284c7; color: white; border: none;">Confirmar Missão</button>
                <button type="button" id="btn-voltar" class="hud-btn" style="width: 100%; margin-top: 5px; background: transparent; color: #94a3b8; border: none;">Voltar</button>
            </div>

            <!-- QUADRO DO FRANK HABBO COM IMAGEM OFICIAL FUNCIONAL -->
            <div id="frank-box" class="frank-container">
                <div class="frank-avatar-wrap">
                    <img src="https://www.habbo.com.br/habbo-imaging/avatarimage?user=Frank&direction=2&head_direction=2&action=std&size=m" alt="Frank Habbo" class="frank-img">
                </div>
                <div id="frank-msg" class="frank-bubble">Seja bem-vindo, oficial! Digite seu nick do Habbo acima para começar.</div>
            </div>
        </div>

        <!-- ILHA DO PERFIL (FLUTUANTE E ARRASTÁVEL) -->
        <div id="profile-island" class="profile-island interactive-panel hidden">
            <div class="profile-header">
                <div class="profile-avatar">
                    <img id="avatar-img" src="" alt="Avatar" style="margin-top: -15px;">
                </div>
                <div>
                    <div id="profile-name" class="profile-name">-JAVA-</div>
                    <div style="font-size: 10px; color: #0284c7; font-weight: bold;">OFICIAL ATIVO</div>
                </div>
            </div>

            <!-- BARRAS DE STATUS -->
            <div class="status-group">
                <div class="status-bar-container">
                    <div class="status-label"><span>Moedas / Salário</span><span>75%</span></div>
                    <div class="bar-bg"><div class="bar-fill fill-coins"></div></div>
                </div>

                <div class="status-bar-container">
                    <div class="status-label"><span>Nível XP</span><span>Lvl 6</span></div>
                    <div class="bar-bg"><div class="bar-fill fill-level"></div></div>
                </div>

                <div class="status-bar-container">
                    <div class="status-label"><span id="profile-motto">Missão: [P3] Agente</span></div>
                    <div class="bar-bg"><div class="bar-fill fill-mission"></div></div>
                </div>
            </div>

            <!-- MINI ABA DE ESTATÍSTICAS -->
